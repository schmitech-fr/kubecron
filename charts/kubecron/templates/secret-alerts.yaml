{{- if and (not .Values.alerts.existingSecret) (include "kubecron.alertsSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecron.alertsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecron.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.alerts.webhookURL }}
  webhook-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.alerts.slackWebhookURL }}
  slack-webhook-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.alerts.teamsWebhookURL }}
  teams-webhook-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.alerts.smtp.password }}
  smtp-password: {{ . | quote }}
  {{- end }}
{{- end }}
