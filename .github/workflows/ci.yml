name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time; the superseded one is cancelled.
#
# On a private repository every job-minute of a run nobody will read is still
# billed. Pushing twice in a minute used to pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go build, vet, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Race detector requires CGO; run on Linux where a C toolchain is present.
      # The production binary is still built with CGO_ENABLED=0 elsewhere.
      - name: Race test
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

      # The v1 module path is a dead end: golangci-lint v2 lives at
      # .../v2/cmd/golangci-lint, so `@latest` on the old path silently pinned
      # CI to the final v1 release and it never picked up a new check again.
      # Installing v2 explicitly keeps CI on the same semantics as .golangci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run

      # Fails on any advisory the code actually reaches, stdlib included, so a
      # vulnerable toolchain or module cannot ship behind a floating base tag.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - run: helm lint charts/kubecron
